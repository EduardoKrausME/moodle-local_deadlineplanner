name: Moodle Plugin CI
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  moodle-plugin-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        moodle-branch: ['MOODLE_405_STABLE', 'MOODLE_500_STABLE']
        php: ['8.2']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: moodle/moodle
          ref: ${{ matrix.moodle-branch }}
          path: moodle
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, intl, gd, xml, mbstring, zip, soap
          coverage: none
      - name: Install Moodle Plugin CI
        run: |
          composer global require moodlehq/moodle-plugin-ci --no-interaction
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"
      - name: Validate PHP syntax
        run: find plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install test environment
        run: |
          moodle-plugin-ci install --plugin "$GITHUB_WORKSPACE/plugin" --db-type pgsql --db-host 127.0.0.1 --db-user moodle --db-pass moodle --db-name moodle --moodle "$GITHUB_WORKSPACE/moodle"
      - run: moodle-plugin-ci validate "$GITHUB_WORKSPACE/plugin" --moodle "$GITHUB_WORKSPACE/moodle"
      - run: moodle-plugin-ci phpcs "$GITHUB_WORKSPACE/plugin" --moodle "$GITHUB_WORKSPACE/moodle"
      - run: moodle-plugin-ci phpunit "$GITHUB_WORKSPACE/plugin" --moodle "$GITHUB_WORKSPACE/moodle" --fail-on-warning
      - run: moodle-plugin-ci behat "$GITHUB_WORKSPACE/plugin" --moodle "$GITHUB_WORKSPACE/moodle" --start-servers
